<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증시 계기판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F5F4F1; --surface: #FFFFFF; --surface-2: #EDEBE6;
    --line: #DCD8D0; --line-soft: #E7E4DE;
    --ink: #1A1A18; --ink-2: #5C5A54; --ink-3: #8A8780;
    --accent: #A8761F; --up: #C8342F; --down: #2757B0; --flat: #8A8780;
    --buy: #2C7A54; --hold: #4A6B86; --cash: #C77B18; --exit: #B32721;
    --on-fill: #FFFFFF; --shadow: 0 1px 2px rgba(26,26,24,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0F1113; --surface:#171A1D; --surface-2:#1E2226; --line:#2B3036; --line-soft:#23282D;
      --ink:#EDEAE4; --ink-2:#A6A29A; --ink-3:#74716B; --accent:#D9A441;
      --up:#F0564F; --down:#5B8FE8; --flat:#74716B;
      --buy:#4FBE86; --hold:#7FA8CC; --cash:#E8A93A; --exit:#F0564F;
      --on-fill:#0F1113; --shadow:none;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0F1113; --surface:#171A1D; --surface-2:#1E2226; --line:#2B3036; --line-soft:#23282D;
    --ink:#EDEAE4; --ink-2:#A6A29A; --ink-3:#74716B; --accent:#D9A441;
    --up:#F0564F; --down:#5B8FE8; --flat:#74716B;
    --buy:#4FBE86; --hold:#7FA8CC; --cash:#E8A93A; --exit:#F0564F;
    --on-fill:#0F1113; --shadow:none;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 56px; }
  .eyebrow { font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  header { display:flex; flex-direction:column; gap:6px; padding-bottom:20px; }
  h1 { margin:0; font-size:27px; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
  .sub { margin:0; color:var(--ink-2); font-size:13px; max-width:62ch; }

  .scores { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .score { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:18px 20px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .score-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .score-head .who { font-size:15px; font-weight:700; }
  .score-head .when { font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); letter-spacing:.03em; text-align:right; }
  .score-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .score-val { font-family:"IBM Plex Mono",monospace; font-size:52px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  .score-val small { font-size:18px; color:var(--ink-3); font-weight:400; }
  .verdict-pill { font-size:24px; font-weight:700; letter-spacing:-.01em; padding:7px 20px; border-radius:4px; white-space:nowrap; background:var(--surface-2); color:var(--ink-3); }
  .verdict-pill.on-buy { background:var(--buy); color:var(--on-fill); }
  .verdict-pill.on-hold { background:var(--hold); color:var(--on-fill); }
  .verdict-pill.on-cash { background:var(--cash); color:var(--on-fill); }
  .verdict-pill.on-exit { background:var(--exit); color:var(--on-fill); }
  .ladder { display:flex; gap:3px; }
  .lz { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:7px 2px; border-radius:3px; background:var(--surface-2); color:var(--ink-3); font-size:12px; font-weight:600; text-align:center; line-height:1.2; }
  .lz small { font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:400; opacity:.85; }
  .lz.active { color:var(--on-fill); font-weight:700; }
  .lz.active.z-exit { background:var(--exit); }
  .lz.active.z-cash { background:var(--cash); }
  .lz.active.z-hold { background:var(--hold); }
  .lz.active.z-buy { background:var(--buy); }
  .score-why { margin:0; font-size:13px; color:var(--ink-2); }

  section { margin-top:36px; }
  .sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .sec-head h2 { margin:0; font-size:16px; font-weight:600; }
  .sec-meta { font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); letter-spacing:.04em; text-align:right; }
  .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--buy); margin-right:5px; vertical-align:middle; }
  .live-dot.idle { background:var(--ink-3); }
  .live-dot.bad { background:var(--cash); }

  .gauges { display:flex; flex-direction:column; gap:2px; }
  .gauge { display:grid; grid-template-columns:172px minmax(0,1fr) 120px; align-items:center; gap:18px; padding:14px 4px; border-bottom:1px solid var(--line-soft); }
  .gauge:last-child { border-bottom:none; }
  .g-name { display:flex; flex-direction:column; gap:2px; }
  .g-name b { font-size:13.5px; font-weight:600; }
  .g-name small { font-size:10.5px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; letter-spacing:.02em; }
  .g-val-wrap { text-align:right; }
  .g-value { font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .g-contrib { font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.04em; display:block; margin-top:2px; color:var(--ink-3); }
  .scale { position:relative; height:26px; }
  .scale-mark { position:absolute; top:4px; width:2px; height:17px; background:var(--ink); transform:translateX(-1px); }
  .scale-ends { position:absolute; top:17px; left:0; right:0; display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .grad { position:absolute; top:8px; left:0; right:0; height:9px; border-radius:2px; }
  .grad.buy-right { background:linear-gradient(90deg, color-mix(in srgb, var(--exit) 26%, transparent), color-mix(in srgb, var(--buy) 34%, transparent)); }
  .grad.buy-left { background:linear-gradient(90deg, color-mix(in srgb, var(--buy) 34%, transparent), color-mix(in srgb, var(--exit) 26%, transparent)); }

  .idx { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:18px; }
  .idx-card { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 18px 14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:7px; }
  .idx-top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .idx-top b { font-size:13.5px; font-weight:600; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; padding:2px 7px; border:1px solid var(--line); border-radius:2px; color:var(--ink-3); white-space:nowrap; }
  .pct-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .pct { font-family:"IBM Plex Mono",monospace; font-size:38px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--flat); }
  .pct.up { color:var(--up); }
  .pct.down { color:var(--down); }
  .pct-basis { font-size:11.5px; color:var(--ink-3); line-height:1.35; }
  .pct-basis b { display:block; color:var(--ink-2); font-weight:600; font-size:12px; }
  .lvl { font-family:"IBM Plex Mono",monospace; font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink-2); }
  .lvl span { color:var(--ink-3); }
  .mini { display:flex; flex-direction:column; gap:4px; margin-top:2px; }
  .breadth-bar { display:flex; height:4px; border-radius:2px; overflow:hidden; background:var(--surface-2); }
  .breadth-bar i { display:block; height:100%; }
  .b-up { background:var(--up); } .b-flat { background:var(--flat); } .b-down { background:var(--down); }
  .mini-label { font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  .stamp { font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); letter-spacing:.03em; }
  .stamp.warnish { color:var(--cash); }

  .note { margin-top:34px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:12px; line-height:1.7; }
  .note p { margin:0 0 6px; } .note p:last-child { margin-bottom:0; }
  .note b { color:var(--ink-2); font-weight:600; }

  @media (max-width:720px) {
    .scores { grid-template-columns:1fr; }
    .idx { grid-template-columns:1fr; }
    .gauge { grid-template-columns:1fr 108px; grid-template-areas:"name value" "scale scale"; gap:8px 12px; }
    .g-name { grid-area:name; } .g-val-wrap { grid-area:value; } .scale { grid-area:scale; }
    h1 { font-size:23px; } .score-val { font-size:44px; } .verdict-pill { font-size:21px; }
    .pct { font-size:33px; } .lz { font-size:11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Market Instrument Board</div>
    <h1>증시 계기판</h1>
    <p class="sub">불안하고 과매도일수록 매수, 과열되고 과매수일수록 탈출 — 그 판단만을 위한 보드. 점수가 높을수록 매수 타이밍입니다.</p>
  </header>

  <div class="scores">
    <div class="score">
      <div class="score-head"><span class="who">미국 주식</span><span class="when" id="us-when">불러오는 중</span></div>
      <div class="score-row">
        <div class="score-val" id="us-score">—<small>/100</small></div>
        <div class="verdict-pill" id="us-verdict">—</div>
      </div>
      <div class="ladder" id="us-ladder"></div>
      <p class="score-why" id="us-why">불러오는 중입니다.</p>
    </div>
    <div class="score">
      <div class="score-head"><span class="who">국내 주식</span><span class="when" id="kr-when">코스피 기준</span></div>
      <div class="score-row">
        <div class="score-val" id="kr-score">—<small>/100</small></div>
        <div class="verdict-pill" id="kr-verdict">—</div>
      </div>
      <div class="ladder" id="kr-ladder"></div>
      <p class="score-why" id="kr-why">코스피를 불러오는 중입니다.</p>
    </div>
  </div>

  <section>
    <div class="sec-head"><h2>미국 지표</h2><div class="sec-meta" id="us-meta">—</div></div>
    <div class="gauges" id="us-gauges"></div>
    <div class="idx" id="us-idx"></div>
  </section>

  <section>
    <div class="sec-head"><h2>국내 지수</h2><div class="sec-meta" id="kr-meta"><span class="live-dot idle"></span>수신 대기</div></div>
    <div class="idx">
      <div class="idx-card" id="q-KOSPI">
        <div class="idx-top"><b>코스피</b><span class="chip">스코어 반영</span></div>
